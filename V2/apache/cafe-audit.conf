<VirtualHost *:80>
    ServerName cafe-audit.local
    DocumentRoot /var/www/cafe-audit-system/public

    <Directory /var/www/cafe-audit-system/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cafe-audit-error.log
    CustomLog ${APACHE_LOG_DIR}/cafe-audit-access.log combined
</VirtualHost>
