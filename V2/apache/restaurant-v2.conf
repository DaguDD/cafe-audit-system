<VirtualHost *:80>
    ServerName restaurant-v2.local
    DocumentRoot /var/www/restaurant-v2/public

    <Directory /var/www/restaurant-v2/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/restaurant-v2-error.log
    CustomLog ${APACHE_LOG_DIR}/restaurant-v2-access.log combined
</VirtualHost>
